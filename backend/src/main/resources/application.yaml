spring:
  application:
    name: mobiletech

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mobiletech
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  storage:
    region: ${STORAGE_REGION}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    endpoint: ${STORAGE_ENDPOINT}
    bucket-name: ${STORAGE_BUCKET_NAME}
    bucket-prefix-products: ${STORAGE_BUCKET_PREFIX_PRODUCTS}
